name: CI/CD Deploy to Ubuntu

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore & Publish
      run: |
        dotnet restore
        dotnet publish -c Release -o ./publish

    - name: Install SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Deploy to new release
      run: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        ssh -i ~/.ssh/id_rsa root@${{ secrets.HOST }} "\
          mkdir -p /home/VlasikhaPlavanieWebsite/releases/$TIMESTAMP \
        "
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          ./publish/ \
          root@${{ secrets.HOST }}:/home/VlasikhaPlavanieWebsite/releases/$TIMESTAMP/

    - name: Switch current & restart service
      run: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        ssh -i ~/.ssh/id_rsa root@${{ secrets.HOST }} "\
          ln -sfn /home/VlasikhaPlavanieWebsite/releases/$TIMESTAMP /home/VlasikhaPlavanieWebsite/current && \
          sudo systemctl restart kestrel.service \
        "
